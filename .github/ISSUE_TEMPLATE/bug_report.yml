name: Bug report
description: Something in the firmware, software, CAD or docs is wrong
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Uno firmware, ESP32 bridge, Python host/simulator, Vision, CAD, BOM/wiring, Documentation, Website]
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened and what you expected }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: How to reproduce, description: "Commands, recipe, scenario file, serial log" }
  - type: input
    id: version
    attributes: { label: Commit or version }
